[pytest]
# WHY THIS FILE EXISTS: without `pythonpath`, bare `pytest` fails with
# "No module named 'app'", while `python -m pytest` works — because the second form
# puts the current directory on sys.path and the first does not.
#
# That difference is a trap. The README would say `pytest`, a reviewer would run it,
# and it would fail on a repo that is actually fine. Setting it here means both forms
# work and the instruction can stay short.
pythonpath = .

testpaths = tests
addopts = -q
